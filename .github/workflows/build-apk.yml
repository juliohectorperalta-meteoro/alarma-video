name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android (si no existe)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Permitir conexiones HTTP a la cámara (red local)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $MANIFEST || \
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i 's/android:screenOrientation="[a-zA-Z]*"//' $MANIFEST || true

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../camara-esp32.apk

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: camara-esp32-apk
          path: camara-esp32.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cámara ESP32 v1.0.${{ github.run_number }}
          files: camara-esp32.apk

  
